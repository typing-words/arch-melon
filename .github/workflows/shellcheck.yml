# Checks every shell script with ShellCheck on each push and pull request
name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning install.sh uninstall.sh \
            home/.local/bin/* home/.config/rofi/scripts/*.sh home/.config/hypr/scripts/*.sh
