# kitty terminal config
# Reload while open: Ctrl+Shift+F5

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

# Look
window_padding_width   12
background_opacity     1.0
hide_window_decorations yes
confirm_os_window_close 0
cursor_shape           beam
cursor_trail           3
# Trail fade time in seconds (fastest, slowest); default is 0.1 0.4
cursor_trail_decay     0.05 0.2
enable_audio_bell      no

# Tabs (Ctrl+Shift+T new tab, Ctrl+Shift+Right/Left switch)
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    slanted

# Selecting text with the mouse copies it to the clipboard (Ctrl+V pastes it anywhere)
copy_on_select clipboard

# Colors: Tokyo Night with a black background
foreground             #d8d8d8
background             #000000
selection_foreground   #d8d8d8
selection_background   #33467c
url_color              #73daca
cursor                 #ff9e64
cursor_text_color      #000000
active_tab_foreground   #1a1b26
active_tab_background   #ff9e64
inactive_tab_foreground #545c7e
inactive_tab_background #000000
active_border_color     #ff9e64
inactive_border_color   #292e42

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
# green
color2  #9ece6a
color10 #9ece6a
# yellow
color3  #e0af68
color11 #e0af68
# blue
color4  #7aa2f7
color12 #7aa2f7
# magenta
color5  #bb9af7
color13 #bb9af7
# cyan
color6  #7dcfff
color14 #7dcfff
# white
color7  #bdbdbd
color15 #e6e6e6

# Super+Backspace / Super+Delete: delete from the cursor to the start / end of the line,
# like Claude Code. kitty can't send Super to bash, so send Ctrl+U / Ctrl+K (readline:
# unix-line-discard / kill-line). "normal" mode only: apps that read keys themselves
# (Claude Code, vim) are left alone.
map super+backspace send_text normal \x15
map super+delete    send_text normal \x0b
