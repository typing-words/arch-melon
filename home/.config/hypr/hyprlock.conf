# hyprlock: lock screen. Unlock with your user password.
# Colors match the rice: Tokyo Night with orange accent, Waybar-style pills.

$font   = JetBrainsMono Nerd Font
$fg     = rgb(c0caf5)
$dim    = rgb(565f89)
$accent = rgb(ff9e64)
$pill   = rgba(1f2335ee)
$red    = rgb(f7768e)

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot     # blurred picture of the desktop
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font ExtraBold
    color = $accent
    position = 0, 280
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = $font
    color = $fg
    position = 0, 190
    halign = center
    valign = center
}

# Profile picture (~/.face), round with an orange ring
image {
    monitor =
    path = ~/.face
    size = 140
    rounding = -1
    border_size = 3
    border_color = $accent
    position = 0, 40
    halign = center
    valign = center
}

# Password pill
input-field {
    monitor =
    size = 320, 52
    rounding = -1         # fully rounded, like the Waybar pills
    outline_thickness = 2
    outer_color = $accent
    inner_color = $pill
    font_color = $fg
    font_family = $font
    check_color = rgb(e0af68)
    fail_color = $red
    fail_text = <i>Wrong password</i>
    capslock_color = rgb(e0af68)
    placeholder_text = <span foreground="##565f89">󰌾  Password</span>
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -110
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = 󰀄  $USER
    font_size = 14
    font_family = $font
    color = $fg
    position = 0, 40
    halign = center
    valign = bottom
}

# Battery
label {
    monitor =
    text = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$b" ] && echo "󰁹  $b%"
    font_size = 12
    font_family = $font
    color = $dim
    position = 0, 15
    halign = center
    valign = bottom
}
