# hypridle: locks after 15 min idle, suspends after 30, and runs hyprlock when logind asks the session to lock
# (lid closed via HandleLidSwitch=lock, and before suspend).

general {
    lock_cmd = pidof hyprlock || hyprlock    # never start a second hyprlock
    before_sleep_cmd = loginctl lock-session # lock before suspending
}

# 15 min idle: lock the screen
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 30 min idle: suspend (it locks first, see before_sleep_cmd)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
